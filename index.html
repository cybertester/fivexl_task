<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony Stark - Business Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #000;
            border: 2px solid #FFD700;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            max-width: 350px;
        }
        .name {
            font-size: 2em;
            color: #FFD700;
            margin-bottom: 10px;
        }
        .title {
            color: #FF6B6B;
            margin-bottom: 20px;
        }
        .contact div {
            margin: 8px 0;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="name">TONY STARK</div>
        <div class="title">CEO, Stark Industries</div>
        <div class="contact">
            <div>📧 tony@starkindustries.com</div>
            <div>📱 +1 (555) IRON-MAN</div>
            <div>🌐 starkindustries.com</div>
            <div>📍 Malibu, CA</div>
        </div>
    </div>
</body>
</html>
